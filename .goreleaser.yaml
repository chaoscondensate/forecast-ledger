version: 2

project_name: forecast-ledger

before:
  hooks:
    - go mod verify
    - go test ./...

builds:
  - id: forecast-ledger
    main: ./cmd/forecast-ledger
    binary: forecast-ledger
    env:
      - CGO_ENABLED=0
    flags:
      - -mod=readonly
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/chaoscondensate/forecast-ledger/internal/buildinfo.version={{ .Version }}
      - -X github.com/chaoscondensate/forecast-ledger/internal/buildinfo.sourceRevision={{ .Commit }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: forecast-ledger
    ids:
      - forecast-ledger
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - THIRD_PARTY_NOTICES.md

nfpms:
  - id: linux-packages
    ids:
      - forecast-ledger
    package_name: forecast-ledger
    # GitHub normalizes `~` in uploaded asset names. Replace it before checksums
    # are generated so prerelease package and SBOM names remain verifiable.
    file_name_template: '{{ replace .ConventionalFileName "~" "." }}'
    vendor: Chaos Condensate
    homepage: https://chaoscondensate.com/
    maintainer: Andrey Korchak <andrey@chaoscondensate.com>
    description: Create and independently check portable forecast evidence.
    license: Apache-2.0
    section: utils
    priority: optional
    bindir: /usr/bin
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/forecast-ledger/LICENSE
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/forecast-ledger/THIRD_PARTY_NOTICES.md
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
    mtime: "{{ .CommitDate }}"

chocolateys:
  - name: forecast-ledger
    ids:
      - forecast-ledger
    package_source_url: https://github.com/chaoscondensate/forecast-ledger
    owners: Chaos Condensate contributors
    title: Forecast Ledger CLI
    authors: Andrey Korchak
    project_url: https://github.com/chaoscondensate/forecast-ledger
    url_template: "https://github.com/chaoscondensate/forecast-ledger/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    copyright: Copyright 2026 Chaos Condensate contributors
    license_url: https://github.com/chaoscondensate/forecast-ledger/blob/main/LICENSE
    require_license_acceptance: false
    project_source_url: https://github.com/chaoscondensate/forecast-ledger
    docs_url: https://github.com/chaoscondensate/forecast-ledger#readme
    bug_tracker_url: https://github.com/chaoscondensate/forecast-ledger/issues
    tags: forecasting forecast-ledger cli mcp
    summary: Create and independently check portable forecast evidence.
    description: |
      Forecast Ledger CLI is a local-first command-line tool and MCP server
      for portable forecast records and evidence.
    release_notes: "https://github.com/chaoscondensate/forecast-ledger/releases/tag/{{ .Tag }}"
    skip_publish: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive
  - id: linux-packages
    artifacts: package
    ids:
      - linux-packages

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
      - "^Merge pull request"
      - "^Merge branch"

release:
  github:
    owner: chaoscondensate
    name: forecast-ledger
  preflight:
    fail_on_error: true
  draft: false
  prerelease: auto
  footer: |
    ---

    Signing status: macOS archives are not Apple-signed or notarized, Windows
    binaries are not code-signed, and Linux and Chocolatey packages are not
    package-signed. Verify published checksums and GitHub artifact attestations
    as described in the installation guide.

    Project context and updates: https://chaoscondensate.com/
